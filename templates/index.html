<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart House Price Prediction v2</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            padding: 20px;
        }

        .container{
            width: 500px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            color: white;
            box-shadow: 0px 8px 32px rgba(0,0,0,0.3);
        }

        h1{
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group{
            margin-bottom: 15px;
        }

        label{
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        button{
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #00c6ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background: #0072ff;
            transform: scale(1.02);
        }

        .prediction{
            margin-top: 25px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #00ff95;
        }

        .insight{
            margin-top: 10px;
            text-align: center;
            font-size: 18px;
            color: #ffd369;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Smart House Price Prediction v2</h1>

        <form action="/predict" method="POST">

            <div class="input-group">
                <label>Bedrooms</label>
                <input type="number" name="bedrooms" required>
            </div>

            <div class="input-group">
                <label>Bathrooms</label>
                <input type="number" step="0.5" name="bathrooms" required>
            </div>

            <div class="input-group">
                <label>Living Area (sqft)</label>
                <input type="number" name="sqft_living" required>
            </div>

            <div class="input-group">
                <label>Floors</label>
                <input type="number" step="0.5" name="floors" required>
            </div>

            <div class="input-group">
                <label>Waterfront</label>

                <select name="waterfront">

                    <option value="0">No</option>

                    <option value="1">Yes</option>

                </select>
            </div>

            <div class="input-group">
                <label>Condition (1-5)</label>
                <input type="number" min="1" max="5" name="condition" required>
            </div>

            <div class="input-group">
                <label>Grade (1-13)</label>
                <input type="number" min="1" max="13" name="grade" required>
            </div>

            <div class="input-group">
                <label>Year Built</label>
                <input type="number" name="yr_built" required>
            </div>

            <button type="submit">
                Predict Price
            </button>

        </form>

        <div class="prediction">
            {{ prediction_text }}
        </div>

        <div class="insight">
            {{ insight }}
        </div>

    </div>

</body>

</html>
